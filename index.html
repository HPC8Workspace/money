<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บัญชีรายวัน">
<meta name="theme-color" content="#f7f1e6">
<title>บัญชีรายวัน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='22'%3E🌿%3C/text%3E%3C/svg%3E">
<!--
  ตัวโหลดถาวร (วางไฟล์นี้ใน GitHub ครั้งเดียว ไม่ต้องแก้อีก)
  หน้าแอปจริงอยู่ในไฟล์ Index.html ของ Google Apps Script — ไฟล์นี้แค่ไปดึงมาแสดงและจำไว้ในเครื่อง
  เมื่ออัปเดต Index.html ใน Apps Script แล้ว Deploy เวอร์ชันใหม่ หน้าเว็บนี้จะได้ของใหม่เอง
  ทางลัดกรณีมีปัญหา:  เติม ?fresh ต่อท้ายลิงก์ = ดึงหน้าแอปใหม่ · เติม ?setup = กรอก URL/KEY ใหม่
-->
<style>
  html,body{margin:0;height:100%}
  body{font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;background:#f7f1e6;color:#1b3338;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.55}
  @media (prefers-color-scheme:dark){ body{background:#0f1d1f;color:#f1ead9} .box{background:#17282b!important;border-color:#2c4347!important} input{background:#0f1d1f!important;color:#f1ead9!important;border-color:#2c4347!important} }
  .box{width:min(92vw,420px);background:#fdfaf3;border:1px solid #e3d6bd;border-radius:18px;padding:22px}
  h1{font-size:20px;margin:0 0 6px} p{margin:6px 0;color:#7a8a8d;font-size:13.5px}
  label{display:block;font-size:12.5px;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #e3d6bd;border-radius:10px;font:inherit;background:#fff}
  button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:#c67856;color:#fff;cursor:pointer;margin-top:16px}
  button.g{background:transparent;color:inherit;text-decoration:underline;padding:10px 8px}
  .spin{width:26px;height:26px;border:3px solid #e3d6bd;border-top-color:#c67856;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
  #msg{color:#b85450}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><p style="text-align:center">กำลังเปิดบัญชีรายวัน…</p></div>
<script>
(function(){
  var LS = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }, del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };
  var box = document.getElementById('box'), q = location.search || '';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function clean(){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }

  function setup(msg){
    box.innerHTML = '<h1>🌿 เริ่มใช้งาน</h1><p>วางลิงก์ Web App ของ Google Apps Script และรหัส WEB_KEY — เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p>'
      + '<label>Web App URL (ลงท้ายด้วย /exec)</label><input id="u" placeholder="https://script.google.com/macros/s/AKf.../exec" value="' + esc(LS.get('gas_url') || '') + '">'
      + '<label>WEB_KEY</label><input id="k" placeholder="รหัสจาก Script Properties" value="' + esc(LS.get('gas_key') || '') + '">'
      + '<div style="text-align:right"><button id="go">บันทึกและเปิดแอป</button></div><p id="msg">' + esc(msg || '') + '</p>';
    document.getElementById('go').onclick = function(){
      var u = document.getElementById('u').value.trim(), k = document.getElementById('k').value.trim(), m = document.getElementById('msg');
      if(!/^https:\/\/script\.google\.com\/macros\/.*\/exec$/.test(u) || !k){ m.textContent = 'กรอก URL (ลงท้าย /exec) และ KEY ให้ครบค่ะ'; return; }
      LS.set('gas_url', u); LS.set('gas_key', k); LS.del('app_html'); LS.del('app_ver'); LS.del('home_cache'); LS.del('mani_cache');
      fetchApp();
    };
  }
  function fail(msg){
    box.innerHTML = '<h1>เปิดแอปไม่สำเร็จ</h1><p id="msg">' + esc(msg) + '</p><div><button id="re">ลองใหม่</button><button class="g" id="st">ตั้งค่า URL / KEY ใหม่</button></div>';
    document.getElementById('re').onclick = function(){ location.reload(); };
    document.getElementById('st').onclick = function(){ setup(''); };
  }
  function boot(html){
    LS.set('app_fail', String((Number(LS.get('app_fail')) || 0) + 1));      // หน้าแอปจะรีเซ็ตเป็น 0 เมื่อโหลดข้อมูลสำเร็จ
    html = html.replace(/<head[^>]*>/i, function(m){ return m + '<script>window.__LOADER=1<\/script>'; });
    document.open(); document.write(html); document.close();
  }
  function fetchApp(){
    box.innerHTML = '<div class="spin"></div><p style="text-align:center">กำลังดาวน์โหลดหน้าแอปเวอร์ชันล่าสุด…</p>';
    fetch(LS.get('gas_url') + '?action=app&k=' + encodeURIComponent(LS.get('gas_key')), {redirect:'follow'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if(j.error) throw new Error(j.error);
        if(!j.html) throw new Error('ไม่ได้รับหน้าแอป');
        LS.set('app_html', j.html); LS.set('app_ver', j.ver); LS.set('app_fail', '0');
        boot(j.html);
      })
      .catch(function(e){
        var m = String(e.message || e);
        var c = LS.get('app_html');
        if(c && c.length > 5000 && !/unauthorized/.test(m)){ LS.set('app_fail', '0'); return boot(c); }   // ดึงของใหม่ไม่ได้ → ใช้ของที่จำไว้ไปก่อน
        if(/unauthorized/.test(m)) return setup('KEY ไม่ถูกต้อง ลองกรอกใหม่ค่ะ');
        if(/unknown action/.test(m)) return fail('สคริปต์ใน Apps Script ยังเป็นรุ่นเก่า: วาง Code.gs / V2.gs / V3.gs / Index.html ชุดล่าสุด แล้ว Deploy › Manage deployments › New version ก่อนค่ะ');
        fail('เชื่อมต่อ Apps Script ไม่ได้ (' + m + ') — ตรวจอินเทอร์เน็ต และตรวจว่า Deploy แบบ "ทุกคน" เข้าถึงได้');
      });
  }

  function start(){
    if(/[?&]setup\b/.test(q)){ clean(); return setup(''); }
    if(/[?&]fresh\b/.test(q)){ clean(); LS.del('app_html'); LS.del('app_ver'); }
    if(!LS.get('gas_url') || !LS.get('gas_key')) return setup('');
    var html = LS.get('app_html');
    if(html && (Number(LS.get('app_fail')) || 0) >= 3){ html = null; }           // เปิดไม่ขึ้นหลายครั้งติดกัน → ดึงหน้าแอปใหม่
    if(html && html.length > 5000) boot(html); else fetchApp();
  }
  // ต้องรอให้หน้านี้อ่านจบก่อน แล้วจึงแทนที่ทั้งหน้าด้วยหน้าแอป (ไม่งั้นสไตล์ของตัวโหลดจะปนกับแอป)
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
